/* Layout: one dark canvas; hero with the live tile grid, a problem ticker, the Available card, the Building wall. */
:root{--ink:#0B0C0F;--ink2:#121419;--ink3:#191C23;--line:rgba(245,243,238,.09);--line2:rgba(245,243,238,.16);
--paper:#F5F3EE;--mute:#9C9A93;--dim:#6D6B66;--lime:#C8F031;--lime-soft:rgba(200,240,49,.12);--lime-glow:rgba(200,240,49,.35);
--display:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}img{max-width:100%}::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.cur{display:inline-block;width:.55em;height:.95em;background:var(--lime);vertical-align:-.1em;margin-left:.06em;border-radius:2px;box-shadow:0 0 18px var(--lime-glow);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,12,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:14px}
.logo{display:flex;align-items:center;gap:2px;text-decoration:none;font:800 21px var(--mono);letter-spacing:-.02em}

.tiles i.on{background:#6f8a1b;border-color:#8fb024;box-shadow:0 0 30px rgba(200,240,49,.25)}

.hero .wrap{position:relative;padding-block:clamp(56px,10vw,120px) clamp(48px,8vw,96px)}
.kicker{display:inline-flex;align-items:center;gap:10px;font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--lime);

.btn:hover{transform:translateY(-2px);box-shadow:0 10px 40px -8px var(--lime-glow);background:#d8ff4a}

.stats b{display:block;font:700 34px/1.1 var(--display);color:var(--paper);font-variant-numeric:tabular-nums}

/* ticker */
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:var(--ink2);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

@keyframes slide{to{transform:translateX(-50%)}}
/* sections */
section.block{padding-block:clamp(64px,9vw,112px)}
.label{display:flex;align-items:center;gap:10px;font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin:0 0 14px}
.label::before{content:"";width:22px;height:2px;background:var(--lime)}

.sub a{color:var(--paper);text-decoration-color:var(--lime);text-underline-offset:3px}
/* the available card: moving lime border */
.feature{position:relative;border-radius:24px;padding:1.5px;background:conic-gradient(from var(--a,0deg),transparent 0 62%,var(--lime) 75%,transparent 88%),var(--line2);animation:spin 6s linear infinite}

.feature .in{position:relative;border-radius:22.5px;background:radial-gradient(120% 140% at 0% 0%,rgba(200,240,49,.10),transparent 55%),var(--ink2);
display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding:clamp(24px,4vw,40px)}
.feature .ic{width:84px;height:84px;border-radius:20px;background:var(--ink);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 40px -10px var(--lime-glow)}
.feature .ic img{width:100%;height:100%;object-fit:cover}
.feature h3{font:700 clamp(24px,3vw,32px)/1.1 var(--display);margin:8px 0 8px;letter-spacing:-.02em}
.feature p{margin:0;color:#cfccc4;max-width:56ch}
.chip{display:inline-flex;align-items:center;gap:8px;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
.chip.live{background:var(--lime-soft);color:var(--lime);border:1px solid rgba(200,240,49,.35)}
.chip.live i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 2s ease-in-out infinite}
.chip.wip{color:var(--mute);border:1px solid var(--line2)}
/* the building wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.app{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:18px;background:var(--ink2);border:1px solid var(--line);overflow:hidden;min-width:0;
transition:border-color .25s,transform .25s}
.app::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,0%),rgba(200,240,49,.10),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.app:hover{border-color:rgba(200,240,49,.35);transform:translateY(-3px)}.app:hover::before{opacity:1}
.app .h{display:flex;align-items:center;gap:14px}
.app .ic{width:52px;height:52px;border-radius:14px;flex:none;background:var(--ink);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;font:800 20px var(--mono);color:var(--lime)}
.app .ic img{width:100%;height:100%;object-fit:cover}
.app h3{font:700 19px/1.2 var(--display);margin:0 0 4px;letter-spacing:-.01em}
.app p{margin:0;color:var(--mute);font-size:15px}
.app .solve{font:500 12.5px var(--mono);color:var(--paper);opacity:.85}.app .solve::before{content:"> ";color:var(--lime)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:auto}
.bar::after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--lime),transparent);animation:scan 2.6s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.step{padding:26px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--ink2),var(--ink))}
.step .n{font:800 13px var(--mono);color:var(--lime);letter-spacing:.1em}
.step h3{font:700 22px var(--display);margin:10px 0 6px}.step p{margin:0;color:var(--mute)}
/* posts */
.posts{display:grid;gap:12px;max-width:820px}
.post{display:block;padding:22px 24px;border-radius:16px;border:1px solid var(--line);background:var(--ink2);text-decoration:none;transition:border-color .2s,transform .2s}
.post:hover{border-color:rgba(200,240,49,.4);transform:translateX(4px)}
.post h3{font:700 22px var(--display);margin:6px 0 4px}.post p{margin:0;color:var(--mute)}
.date{font:500 12px var(--mono);color:var(--lime);letter-spacing:.06em}
.empty{padding:28px;border:1px dashed var(--line2);border-radius:16px;color:var(--mute);font-family:var(--mono)}
/* article */
article{max-width:720px;padding-block:56px 72px}
article h1{font:700 clamp(36px,6vw,58px)/1.02 var(--display);letter-spacing:-.03em;margin:10px 0 26px;text-wrap:balance}
article h2{font-size:28px;margin:40px 0 10px}article p,article li{font-size:18.5px;line-height:1.75;color:#dedbd3}
article a{color:var(--paper);text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
article li::marker{color:var(--lime)}article strong{color:var(--paper)}
.draft{display:inline-block;background:rgba(255,200,60,.12);border:1px solid rgba(255,200,60,.5);color:#ffd36b;padding:6px 12px;border-radius:8px;font:700 12px var(--mono)}
.signup{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;padding:30px;border-radius:20px;border:1px solid rgba(200,240,49,.3);background:radial-gradient(120% 160% at 100% 0%,rgba(200,240,49,.12),transparent 60%),var(--ink2)}
.signup h2{font-size:28px;margin:0}.signup p{margin:6px 0 0;color:var(--mute)}
/* footer */
footer{border-top:1px solid var(--line);padding-block:56px 40px;overflow:hidden}
.big{font:800 clamp(56px,15vw,200px)/.85 var(--mono);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px rgba(245,243,238,.18);white-space:nowrap;margin:0 0 36px}
.big .cur{-webkit-text-stroke:0}
footer .row{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;color:var(--mute);font:500 13px var(--mono)}
footer a{text-decoration:none}footer a:hover{color:var(--lime)}
/* reveal: visible by default, animates only once JS marks the page */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease-out,transform .6s ease-out}.js .rv.in{opacity:1;transform:none}
@media (max-width:760px){
 nav.links a:not(.go){padding:8px 8px}nav.links .hide-s{display:none}
 .feature .in{grid-template-columns:1fr;gap:18px}.feature .ic{width:68px;height:68px}
 .tiles{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));grid-auto-rows:48px;gap:8px;mask-image:radial-gradient(ellipse 110% 32% at 80% 12%,#000 10%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 110% 32% at 80% 12%,#000 10%,transparent 80%)}
 .stats{gap:10px 26px}.stats b{font-size:28px}
}

<main><div class="wrap"><article style="max-width:820px"><p class="label">blog</p><h1>Build notes</h1><p class="sub">One problem, one app, every week. What worked and what broke.</p><div class="posts"><div class="empty">&gt; first post compiling<span class="cur" aria-hidden="true"></span></div></div><div style="margin-top:32px"></div></article></div></main>

<script type="application/json" id="problems">[]</script><script>
(function(){
var calm=matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.classList.add('js');
// reveal on scroll (content is visible without JS)
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'}):null;
document.querySelectorAll('.rv').forEach(function(el){io&&!calm?io.observe(el):el.classList.add('in')});

document.querySelectorAll('.app').forEach(function(c){c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-r.left)+'px');c.style.setProperty('--y',(e.clientY-r.top)+'px')})});
// hero tiles: a few light up lime, like the banner; the pointer lights the one under it
var g=document.querySelector('.tiles');if(g){var n=Math.ceil(innerWidth/70)*Math.ceil(g.offsetHeight/70)+20,h='';for(var i=0;i<n;i++)h+='<i></i>';g.innerHTML=h;
 var t=g.children;function lit(){for(var k=0;k<t.length;k++)t[k].classList.remove('on');for(var k=0;k<Math.max(6,t.length/14);k++)t[Math.floor(Math.random()*t.length)].classList.add('on')}lit();
 if(!calm){setInterval(lit,2400);var hero=document.querySelector('.hero');hero.addEventListener('pointermove',function(e){var el=document.elementsFromPoint(e.clientX,e.clientY).find(function(x){return x.parentNode===g});if(el&&!el.classList.contains('hot')){el.classList.add('hot');setTimeout(function(){el.classList.remove('hot')},500)}})}}

var ty=document.querySelector('.typed .w'),words=JSON.parse(document.getElementById('problems').textContent);
if(ty&&!calm){var wi=0,ci=0,del=false;(function step(){var w=words[wi];ty.textContent=w.slice(0,ci);
 if(!del&&ci<w.length){ci++;setTimeout(step,45)}else if(!del){del=true;setTimeout(step,1700)}else if(ci>0){ci--;setTimeout(step,18)}else{del=false;wi=(wi+1)%words.length;setTimeout(step,250)}})()}
})();
